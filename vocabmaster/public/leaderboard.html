<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - VocabMaster</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --emerald: #50C878;
      --emerald-dark: #2d7a5c;
      --gold: #D4AF37;
      --ink: #0f172a;
      --slate: #334155;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.12);
      --panel: rgba(255, 255, 255, 0.86);
      --panel-strong: #ffffff;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; }
    body {
      font-family: 'Poppins', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(80, 200, 120, 0.15), transparent 30%),
        radial-gradient(circle at top right, rgba(212, 175, 55, 0.18), transparent 26%),
        linear-gradient(135deg, #f6fff8 0%, #fffaf0 48%, #f8fbff 100%);
    }

    .shell {
      max-width: 1340px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ── Header ────────────────────────────────────────────── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--emerald), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
    }

    .back-btn {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: var(--ink);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--panel);
      border-color: rgba(80, 200, 120, 0.24);
    }

    /* ── Hero ──────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, rgba(80, 200, 120, 0.96), rgba(45, 122, 92, 0.98));
      color: white;
      border-radius: 28px;
      padding: 26px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: auto -80px -80px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.20);
      filter: blur(10px);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 3.5vw, 40px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      max-width: 480px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Filters ────────────────────────────────────────────── */
    .filter-panel {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr auto;
      gap: 12px;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: white;
      outline: none;
    }

    select:focus, input:focus {
      border-color: rgba(80, 200, 120, 0.55);
      box-shadow: 0 0 0 4px rgba(80, 200, 120, 0.12);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(80, 200, 120, 0.3);
    }

    /* ── Your Rank Banner ──────────────────────────────────── */
    .your-rank-banner {
      background: linear-gradient(135deg, rgba(80, 200, 120, 0.12), rgba(212, 175, 55, 0.08));
      border: 1px solid rgba(80, 200, 120, 0.2);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      display: none;
    }

    .your-rank-banner.visible {
      display: block;
    }

    .your-rank-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .your-rank-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .your-rank-medal {
      font-size: 32px;
      line-height: 1;
    }

    .your-rank-info h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .your-rank-info p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .your-rank-tier {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tier-badge {
      font-size: 16px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(80, 200, 120, 0.12);
      color: var(--emerald-dark);
    }

    /* ── Leaderboard Table ────────────────────────────────── */
    .leaderboard-container {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: auto;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    thead {
      background: linear-gradient(180deg, #fafafa, #f8faf5);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--slate);
      border-bottom: 1px solid var(--line);
    }

    tbody tr {
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    }

    tbody tr:hover {
      background: rgba(80, 200, 120, 0.02);
    }

    td {
      padding: 16px;
      font-size: 14px;
      color: var(--ink);
    }

    .rank-cell {
      font-weight: 700;
      color: var(--muted);
      min-width: 50px;
    }

    .rank-medal {
      font-size: 16px;
      margin-right: 6px;
    }

    .player-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 200px;
    }

    .player-name {
      font-weight: 700;
      color: var(--ink);
    }

    .player-tier {
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: fit-content;
    }

    .stat-value {
      font-weight: 700;
      color: var(--slate);
      text-align: right;
      min-width: 80px;
    }

    .empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    .empty-text {
      font-size: 15px;
      margin: 0;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(80, 200, 120, 0.18);
      border-top-color: var(--emerald);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .meta-text {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 1180px) {
      .filter-panel {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 760px) {
      .shell { padding: 14px; }
      .hero { padding: 18px; border-radius: 22px; }
      .hero h1 { font-size: 26px; }
      .filter-panel {
        grid-template-columns: 1fr;
      }
      .your-rank-content {
        flex-direction: column;
        align-items: flex-start;
      }
      table { min-width: 640px; }
      td { padding: 12px; font-size: 12px; }
      th { padding: 10px 12px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo" onclick="window.location.href='/student-learn-v3.html'">VocabMaster</div>
        <button class="back-btn" onclick="window.history.back()">← Back</button>
      </div>
    </div>

    <!-- Hero -->
    <section class="hero">
      <div class="hero-content">
        <h1>🏆 Leaderboard</h1>
        <p>See where you stand among all learners. Compete, improve, and climb the ranks!</p>
      </div>
    </section>

    <!-- Filters -->
    <div class="filter-panel">
      <div class="filter-group">
        <label class="filter-label">Scope</label>
        <select id="scopeSelect">
          <option value="global">Global</option>
          <option value="creator">Creator Group</option>
          <option value="class">Class</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Period</label>
        <select id="periodSelect">
          <option value="all">All Time</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Class Code (if applicable)</label>
        <input id="classCodeInput" type="text" placeholder="Enter class code..." />
      </div>
      <button class="btn" id="applyBtn">Apply Filters</button>
    </div>

    <!-- Your Rank Banner -->
    <div class="your-rank-banner" id="yourRankBanner">
      <div class="your-rank-content">
        <div class="your-rank-left">
          <div class="your-rank-medal" id="yourMedal">🏅</div>
          <div class="your-rank-info">
            <h3 id="yourName">You</h3>
            <p id="yourRankText">#1 of 50</p>
          </div>
        </div>
        <div class="your-rank-tier">
          <div class="tier-badge" id="yourTier">💎 Sapphire</div>
          <span id="yourXP" style="font-weight:700;color:var(--slate)">1500 XP</span>
        </div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="leaderboard-container">
      <table>
        <thead>
          <tr>
            <th style="width:60px">Rank</th>
            <th>Player</th>
            <th style="width:100px">XP</th>
            <th style="width:120px">Streak</th>
            <th style="width:100px">Accuracy</th>
            <th style="width:100px">Words</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr style="text-align:center;padding:40px;">
            <td colspan="6" class="loading">
              <span class="spinner"></span>
              Loading leaderboard...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="meta-text" id="metaText"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let leaderboardData = null;
    const LEAGUE_TIERS = [
      { name: 'Sapphire',  icon: '💎', min: 10000, color: '#38bdf8' },
      { name: 'Platinum',  icon: '👑', min: 4000,  color: '#e2e8f0' },
      { name: 'Gold',      icon: '⭐', min: 1500,  color: '#f5c842' },
      { name: 'Silver',    icon: '✨', min: 500,   color: '#94a3b8' },
      { name: 'Bronze',    icon: '🔶', min: 0,     color: '#cd7f32' },
    ];

    // ── Init ───────────────────────────────────────────────────
    async function init() {
      if (!requireAuth()) return;
      setupFilters();
      await loadLeaderboard();
    }

    // ── Setup Filter Events ────────────────────────────────────
    function setupFilters() {
      document.getElementById('applyBtn').addEventListener('click', loadLeaderboard);
      document.getElementById('periodSelect').addEventListener('change', loadLeaderboard);
    }

    // ── Get League Tier ────────────────────────────────────────
    function getLeagueTier(xp) {
      return LEAGUE_TIERS.find((t) => xp >= t.min) || LEAGUE_TIERS[LEAGUE_TIERS.length - 1];
    }

    // ── Load Leaderboard ────────────────────────────────────────
    async function loadLeaderboard() {
      const scope = document.getElementById('scopeSelect').value;
      const period = document.getElementById('periodSelect').value;
      const classCode = document.getElementById('classCodeInput').value.trim();

      const params = new URLSearchParams({ scope, period, classCode, limit: 50 });
      try {
        leaderboardData = await api.get(`/progress/leaderboard?${params}`);
        renderLeaderboard();
      } catch (err) {
        console.error('Failed to load leaderboard:', err);
        document.getElementById('leaderboardBody').innerHTML = 
          `<tr><td colspan="6" class="empty"><div class="empty-icon">❌</div><p class="empty-text">${esc(err.message || 'Failed to load leaderboard')}</p></td></tr>`;
      }
    }

    // ── Render Leaderboard ────────────────────────────────────
    function renderLeaderboard() {
      const rows = Array.isArray(leaderboardData?.leaderboard) ? leaderboardData.leaderboard : [];
      const period = leaderboardData?.period || 'all_time';
      const scope = leaderboardData?.scope || 'global';
      const cur = leaderboardData?.currentUserRank;

      // Your rank banner
      const banner = document.getElementById('yourRankBanner');
      if (cur) {
        const tier = getLeagueTier(Number(cur.totalXP || 0));
        const total = Number(leaderboardData?.totalRankedUsers || 0);
        document.getElementById('yourName').textContent = esc(cur.name || 'You');
        document.getElementById('yourRankText').textContent = `#${Number(cur.rank || '?')}${total ? ' of ' + total : ''}`;
        document.getElementById('yourMedal').textContent = ['🥇','🥈','🥉'][Number(cur.rank || 0) - 1] || '🏅';
        document.getElementById('yourTier').textContent = `${tier.icon} ${tier.name}`;
        document.getElementById('yourXP').textContent = Math.round(Number(cur.totalXP || 0)).toLocaleString() + ' XP';
        banner.classList.add('visible');
      } else {
        banner.classList.remove('visible');
      }

      // Meta text
      const periodLabel = periodLabelText(period);
      const scopeLabel = scopeLabelText(scope);
      document.getElementById('metaText').textContent = `Showing ${scopeLabel} ${periodLabel} ranking. ${rows.length} learners ranked.`;

      // Table
      if (!rows.length) {
        document.getElementById('leaderboardBody').innerHTML = 
          `<tr><td colspan="6" class="empty"><div class="empty-icon">📊</div><p class="empty-text">No ranked learners yet.</p></td></tr>`;
        return;
      }

      const xpLabel = period === 'all_time' ? 'XP' : periodLabel + ' XP';
      const medals = ['🥇','🥈','🥉'];
      document.getElementById('leaderboardBody').innerHTML = rows.map((row) => {
        const rankNum = Number(row.rank || 0);
        const medal = rankNum <= 3 ? medals[rankNum - 1] : '•';
        const tier = getLeagueTier(Number(row.totalXP || 0));
        return `
          <tr>
            <td class="rank-cell">
              <span class="rank-medal">${medal}</span>#${rankNum}
            </td>
            <td>
              <div class="player-cell">
                <span class="player-name">${esc(row.name || 'Learner')}</span>
                <span class="player-tier" style="color:${tier.color}">
                  ${tier.icon} ${tier.name}
                </span>
              </div>
            </td>
            <td class="stat-value">${Math.round(Number(row.totalXP || 0)).toLocaleString()}</td>
            <td class="stat-value">${Number(row.streak || 0)} day${Number(row.streak || 0) === 1 ? '' : 's'}</td>
            <td class="stat-value">${Math.round(Number(row.avgAccuracy || 0))}%</td>
            <td class="stat-value">${Number(row.wordsLearned || 0)}</td>
          </tr>
        `;
      }).join('');
    }

    // ── Helpers ────────────────────────────────────────────────
    function periodLabelText(p) {
      const map = { all_time: 'all-time', weekly: 'weekly', monthly: 'monthly' };
      return map[p] || p;
    }

    function scopeLabelText(s) {
      const map = { global: 'global', creator: 'creator group', class: 'class' };
      return map[s] || s;
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = String(str || '');
      return div.innerHTML;
    }

    // ── Start ──────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
