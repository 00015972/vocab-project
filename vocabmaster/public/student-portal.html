<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal — VocabMaster</title>
  <link rel="stylesheet" href="/css/main.css" />
  <script>
    window.location.replace('/login-ultra.html?role=student');
  </script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo" style="display: flex; align-items: center; justify-content: center; gap: 10px;">

    </div>
    <div class="auth-subtitle">Student Portal</div>
    <h2 style="margin-bottom:14px">Solve creator content only</h2>
    <p style="color:var(--muted);margin-bottom:24px;line-height:1.6">

    </p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <a href="/register-ultra.html?role=student" class="btn btn-primary btn-full">Create Student Account</a>
      <a href="/login-ultra.html?role=student" class="btn btn-secondary btn-full">Sign In as Student</a>
      <a href="creator-portal.html" class="btn btn-ghost btn-full">Switch to Creator Portal</a>

  </div>
</div>

</html>
