<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — VocabMaster</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .stats-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:28px; }
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; text-align:center; }
    .stat-card .num { font-size:2rem; font-weight:800; color:var(--accent2); }
    .stat-card .lbl { font-size:0.78rem; color:var(--muted); margin-top:2px; }
    .dash-layout { display:grid; grid-template-columns:360px 1fr; gap:24px; }
    @media(max-width:900px){.dash-layout{grid-template-columns:1fr;}}
    .word-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .word-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; transition:border-color 0.2s; }
    .word-card:hover { border-color:var(--accent); }
    .word-title { font-size:1.1rem; font-weight:700; color:var(--accent2); margin-bottom:4px; }
    .pos-badge { display:inline-block; padding:2px 8px; background:var(--surface2); border-radius:20px; font-size:0.72rem; color:var(--muted); margin-bottom:8px; }
    .word-def { font-size:0.87rem; line-height:1.5; margin-bottom:6px; }
    .word-ex  { font-size:0.82rem; color:var(--muted); font-style:italic; line-height:1.4; }
    .word-actions { display:flex; gap:6px; margin-top:12px; }
    .list-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
    .list-header input { max-width:220px; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state .icon { font-size:3rem; margin-bottom:12px; }
    .form-card { position:sticky; top:20px; }
  </style>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <button class="sidebar-toggle" id="sidebarToggle">☰</button>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo" style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
      <img src="https://www.image2url.com/r2/default/images/1784112907446-0463de99-8cb2-4889-82b8-3e0c5207bc0d.jpg" alt="Taleem Lexicon" style="width:40px; height:40px; border-radius:50%;">
      <span style="font-weight:bold; color:var(--accent);">Taleem Lexicon</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="dashboard" href="/dashboard.html"><span class="nav-icon">📚</span> My Words</a>
      <a class="nav-item" data-page="flashcards" href="/flashcards.html"><span class="nav-icon">🃏</span> Flashcards</a>
      <a class="nav-item" data-page="quiz" href="/quiz.html"><span class="nav-icon">✏️</span> Quiz</a>
      <a class="nav-item" data-page="ai-tutor" href="/ai-tutor.html"><span class="nav-icon">🤖</span> AI Tutor</a>
      <a class="nav-item" data-page="profile" href="/profile.html"><span class="nav-icon">👤</span> Profile</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebarUserName">Loading...</div>
          <div class="user-email" id="sidebarUserEmail"></div>
        </div>
      </div>
      <button type="button" class="nav-item" data-logout onclick="logout()" style="color:var(--red)"><span class="nav-icon">🚪</span> Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <div class="page-header">
      <h1>📚 My Vocabulary</h1>
      <p>Add words manually or let AI generate definitions and examples.</p>
    </div>
    <div class="page-content">
      <!-- Stats -->
      <div class="stats-bar">
        <div class="stat-card"><div class="num" id="statTotal">—</div><div class="lbl">Total Words</div></div>
        <div class="stat-card"><div class="num" id="statWeek">—</div><div class="lbl">Added This Week</div></div>
        <div class="stat-card"><div class="num" id="statAvgDiff">—</div><div class="lbl">Avg Difficulty</div></div>
      </div>

      <div class="dash-layout">
        <!-- Word Form -->
        <div class="form-card">
          <div class="card">
            <h3 id="formTitle" style="font-size:1rem;color:var(--accent2);margin-bottom:16px">➕ Add New Word</h3>
            <input type="hidden" id="editingId" />
            <div class="form-group">
              <label>Word *</label>
              <input type="text" id="inputWord" placeholder="e.g. serendipity" />
            </div>
            <div class="form-group">
              <label>Part of Speech</label>
              <select id="inputPos">
                <option value="other">— Select —</option>
                <option value="noun">Noun</option>
                <option value="verb">Verb</option>
                <option value="adjective">Adjective</option>
                <option value="adverb">Adverb</option>
                <option value="phrase">Phrase</option>
                <option value="idiom">Idiom</option>
              </select>
            </div>
            <div class="form-group">
              <label>Definition *</label>
              <textarea id="inputDef" placeholder="Enter the definition..."></textarea>
            </div>
            <div class="form-group">
              <label>Example Sentence</label>
              <textarea id="inputEx" placeholder="Use the word in a sentence..." style="min-height:60px"></textarea>
            </div>
            <div class="form-group">
              <label>Your Notes / Resources</label>
              <textarea id="inputNotes" placeholder="Memory tricks, synonyms, extra notes..." style="min-height:60px"></textarea>
            </div>
            <div class="form-group">
              <label>Difficulty (1–5)</label>
              <input type="number" id="inputDiff" min="1" max="5" value="3" />
            </div>
            <button class="btn btn-secondary btn-full" id="aiBtn" onclick="aiAutoFill()" style="margin-bottom:10px">✨ AI Auto-fill Definition & Example</button>
            <div style="display:flex;gap:8px">
              <button class="btn btn-primary" style="flex:1" id="saveBtn" onclick="saveWord()">💾 Save Word</button>
              <button class="btn btn-ghost btn-sm" onclick="clearForm()">✕</button>
            </div>
          </div>
        </div>

        <!-- Word List -->
        <div>
          <div class="list-header">
            <span style="color:var(--muted);font-size:0.85rem" id="wordCount">0 words</span>
            <input type="text" id="searchWords" placeholder="🔍 Search words..." oninput="renderWords()" />
          </div>
          <div id="wordGrid" class="word-grid">
            <div class="empty-state" style="grid-column:1/-1"><div class="icon">📖</div><p>No words yet. Add your first word!</p></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
