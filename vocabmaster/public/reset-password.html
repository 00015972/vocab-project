<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset Password — VocabMaster</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
      <img src="https://www.image2url.com/r2/default/images/1784112907446-0463de99-8cb2-4889-82b8-3e0c5207bc0d.jpg" alt="Taleem Lexicon" style="width: 40px; height: 40px; border-radius: 50%;">
      <span style="font-size: 1.2rem; font-weight: bold;">Taleem Lexicon</span>
    </div>
    <h2 style="margin-bottom:8px">Set New Password</h2>
    <p style="color:var(--muted);font-size:0.88rem;margin-bottom:24px">Choose a strong new password for your account.</p>
    <div id="alertBox"></div>
    <div id="formSection">
      <form id="resetForm">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="password" minlength="12" maxlength="128" placeholder="At least 12 characters" required />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" minlength="12" maxlength="128" placeholder="Repeat new password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Reset Password</button>
      </form>
    </div>
    <div id="successSection" class="hidden" style="text-align:center;padding:16px 0">
      <div style="font-size:3rem;margin-bottom:12px">🔐</div>
      <h3 style="margin-bottom:8px">Password Reset!</h3>
      <p style="color:var(--muted);line-height:1.6;margin-bottom:20px">Your password has been changed. You can now log in.</p>
      <a href="/login-ultra.html" class="btn btn-primary">Go to Login</a>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/js/api.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">Invalid reset link. Please request a new one.</div>';
  document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';

  if (password !== confirm) {
    alertBox.innerHTML = '<div class="alert alert-error">Passwords do not match.</div>';
    return;
  }
  if (password.length < 12 || password.length > 128) {
    alertBox.innerHTML = '<div class="alert alert-error">Password must be between 12 and 128 characters.</div>';
    return;
  }

  const btn = document.getElementById('submitBtn');
  setLoading(btn, true, 'Resetting...');
  try {
    await api.post('/auth/reset-password', { token, password });
    document.getElementById('formSection').classList.add('hidden');
    document.getElementById('successSection').classList.remove('hidden');
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
  } finally {
    setLoading(btn, false);
  }
});
</script>
</body>
</html>
