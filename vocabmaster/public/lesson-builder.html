<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taleem Lexicon - Course Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #D4AF37; --emerald: #50C878; --dark: #1a1a1a; }
    * { font-family: 'Poppins', sans-serif; }
    body { background: #f0f9ff; }

    .builder-container {
      display: grid;
      grid-template-columns: 300px 1fr 350px;
      gap: 20px;
      min-height: 100vh;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .panel {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      overflow-y: auto;
      max-height: 100vh;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--dark);
    }

    .resource-item {
      padding: 12px;
      background: #f0f9ff;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .resource-item:hover {
      border-color: var(--emerald);
      background: rgba(80, 200, 120, 0.1);
    }

    .resource-item.selected {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.1);
    }

    .resource-word {
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .resource-def {
      font-size: 12px;
      color: #666;
      line-height: 1.3;
    }

    .lesson-canvas {
      background: white;
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      min-height: 400px;
    }

    .canvas-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
      background: linear-gradient(135deg, var(--gold), var(--emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .exercise-builder {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
    }

    .exercise-type {
      padding: 12px 16px;
      background: white;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      font-weight: 600;
    }

    .exercise-type:hover {
      border-color: var(--emerald);
      box-shadow: 0 4px 12px rgba(80, 200, 120, 0.2);
    }

    .exercise-type.selected {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.1);
    }

    .exercise-preview {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      border: 2px dashed #e0e0e0;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--emerald), #2d7a5c);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(80, 200, 120, 0.3);
    }

    .btn-secondary {
      background: var(--gold);
      color: var(--dark);
    }

    .btn-secondary:hover {
      opacity: 0.9;
    }

    .lesson-header {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .lesson-header input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
    }

    .properties {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .property {
      padding: 12px;
      background: #f0f9ff;
      border-radius: 8px;
      border-left: 4px solid var(--emerald);
    }

    .property-label {
      font-size: 11px;
      color: #999;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .property-value {
      font-weight: 700;
      color: var(--dark);
    }

    .stat-box {
      background: linear-gradient(135deg, rgba(80,200,120,0.1), rgba(212,175,55,0.05));
      border-left: 5px solid var(--emerald);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      font-weight: 600;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--emerald);
      margin-top: 5px;
    }

    @media (max-width: 1200px) {
      .builder-container {
        grid-template-columns: 1fr;
      }
      .panel { max-height: 400px; }
    }
  </style>
</head>
<body>
  <div class="builder-container">
    <!-- Left Panel: Resources -->
    <div class="panel">
      <div class="panel-title">📚 Available Resources</div>

      <div style="margin-bottom: 15px;">
        <input type="text" placeholder="Search words..." id="searchInput" onkeyup="searchResources()" 
          style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: Poppins;">
      </div>

      <div id="resourcesList">
        <div style="text-align: center; padding: 30px 0; color: #999;">Loading resources...</div>
      </div>
    </div>

    <!-- Center: Lesson Canvas -->
    <div class="panel lesson-canvas">
      <div class="lesson-header">
        <div style="display:flex; align-items:center; gap:8px; flex:1;">
          <img src="https://www.image2url.com/r2/default/images/1784112907446-0463de99-8cb2-4889-82b8-3e0c5207bc0d.jpg" alt="Taleem Lexicon" style="width:30px; height:30px; border-radius:50%;">
          <span style="font-weight:bold; color:#666; font-size:0.9rem;">Taleem Lexicon</span>
        </div>
        <input type="text" id="lessonTitle" placeholder="Lesson Title (e.g., Greetings)">
        <button class="btn btn-primary" onclick="saveLesson()" style="flex: 0 1 120px; margin: 0;">Save</button>
      </div>

      <div id="exercisesContainer">
        <div style="text-align: center; padding: 60px 20px; color: #999;">
          👈 Select words to create exercises
        </div>
      </div>

      <button class="btn btn-secondary" onclick="addExercise()" style="margin-top: 40px;">+ Add Exercise</button>
    </div>

    <!-- Right Panel: Properties -->
    <div class="panel">
      <div class="panel-title">⚙️ Properties</div>

      <div class="stat-box">
        <div class="stat-label">Exercises</div>
        <div class="stat-value" id="exerciseCount">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Words Used</div>
        <div class="stat-value" id="wordsCount">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Est. Duration</div>
        <div class="stat-value" id="duration">5 min</div>
      </div>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid #e0e0e0;">

      <div class="panel-title" style="margin-bottom: 15px;">Exercise Type</div>

      <div class="exercise-type" onclick="setExerciseType('multiple-choice', this)">
        Multiple Choice
      </div>
      <div class="exercise-type" onclick="setExerciseType('fill-blank', this)">
        Fill in the Blank
      </div>
      <div class="exercise-type" onclick="setExerciseType('pronunciation', this)">
        Pronunciation
      </div>
      <div class="exercise-type" onclick="setExerciseType('matching', this)">
        Matching
      </div>
      <div class="exercise-type" onclick="setExerciseType('essay', this)">
        Essay
      </div>

      <button class="btn btn-primary" onclick="previewLesson()">👁️ Preview</button>
      <button class="btn btn-secondary" onclick="goBack()">← Back</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let allResources = [];
    let selectedResources = [];
    let exercises = [];
    let currentExerciseType = 'multiple-choice';

    async function initialize() {
      const token = localStorage.getItem('token');
      if (!token) return window.location.href = '/login.html';

      try {
        const userPayload = await (await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        })).json();
        const user = userPayload.user || userPayload;

        if (user.role !== 'creator' && user.role !== 'admin') {
          return window.location.href = '/student-dashboard.html';
        }

        loadResources();
      } catch (error) {
        console.error('Error:', error);
      }
    }

    async function loadResources() {
      const token = localStorage.getItem('token');
      try {
        const response = await fetch('/api/words?limit=500', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        allResources = data.words || [];
        renderResources(allResources);
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function renderResources(resources) {
      const container = document.getElementById('resourcesList');
      container.innerHTML = resources.map(word => `
        <div class="resource-item ${selectedResources.includes(word._id) ? 'selected' : ''}" onclick="selectResource('${word._id}', this)">
          <div class="resource-word">${word.word}</div>
          <div class="resource-def">${word.definition}</div>
        </div>
      `).join('');
    }

    function searchResources() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allResources.filter(r => 
        r.word.toLowerCase().includes(query) || 
        r.definition.toLowerCase().includes(query)
      );
      renderResources(filtered);
    }

    function selectResource(id, element) {
      if (selectedResources.includes(id)) {
        selectedResources = selectedResources.filter(r => r !== id);
      } else {
        selectedResources.push(id);
      }

      element.classList.toggle('selected');
      updateProperties();
      renderExercises();
    }

    function addExercise() {
      if (selectedResources.length === 0) {
        alert('Select at least one word first!');
        return;
      }

      const words = selectedResources.map(id => allResources.find(r => r._id === id)).filter(Boolean);
      exercises.push({
        id: Date.now(),
        type: currentExerciseType,
        words: words
      });

      updateProperties();
      renderExercises();
    }

    function renderExercises() {
      const container = document.getElementById('exercisesContainer');

      if (exercises.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: #999;">👈 Select words to create exercises</div>';
        return;
      }

      container.innerHTML = exercises.map((ex, i) => `
        <div class="exercise-builder">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div>
              <div style="font-weight: 700; color: var(--dark);">Exercise ${i + 1}: ${ex.type}</div>
              <div style="font-size: 12px; color: #999;">${ex.words.length} word(s)</div>
            </div>
            <button onclick="removeExercise(${i})" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;">Delete</button>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            ${ex.words.map(w => `<div style="background: var(--emerald); color: white; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;">${w.word}</div>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function removeExercise(index) {
      exercises.splice(index, 1);
      updateProperties();
      renderExercises();
    }

    function setExerciseType(type, eventTarget) {
      currentExerciseType = type;
      document.querySelectorAll('.exercise-type').forEach(el => el.classList.remove('selected'));
      if (eventTarget) {
        eventTarget.classList.add('selected');
      }
    }

    function updateProperties() {
      document.getElementById('exerciseCount').textContent = exercises.length;
      document.getElementById('wordsCount').textContent = selectedResources.length;
      document.getElementById('duration').textContent = (exercises.length * 5) + ' min';
    }

    function buildMultipleChoicePreview(exercise, index) {
      const words = Array.isArray(exercise.words) ? exercise.words.filter(Boolean) : [];
      const anchor = words[0] || { word: 'word', definition: 'definition' };
      const fallback = allResources.find(r => r && r._id !== anchor._id && r.definition);
      const distractors = words
        .slice(1)
        .filter(w => w && w.definition)
        .slice(0, 3)
        .map(w => w.definition);

      if (fallback && distractors.length < 3) distractors.push(fallback.definition);
      while (distractors.length < 3) {
        distractors.push(`Alternative meaning ${distractors.length + 1}`);
      }

      const options = [anchor.definition || 'Definition unavailable', ...distractors.slice(0, 3)];
      return {
        id: `preview-${index}`,
        type: 'multiple-choice',
        question: `What is the best definition of "${anchor.word || 'this word'}"?`,
        options,
        correctIndex: 0,
        explanation: anchor.definition || 'No explanation available.',
      };
    }

    function buildFillBlankPreview(exercise, index) {
      const words = Array.isArray(exercise.words) ? exercise.words.filter(Boolean) : [];
      const anchor = words[0] || { word: 'example', example: '', definition: '' };
      const sourceSentence = String(anchor.example || '').trim();
      const normalizedWord = String(anchor.word || '').trim();
      const blankQuestion = sourceSentence && normalizedWord
        ? sourceSentence.replace(new RegExp(normalizedWord, 'ig'), '____')
        : `Complete the sentence with the correct word: ____ means ${anchor.definition || 'the intended meaning'}.`;

      return {
        id: `preview-${index}`,
        type: 'fill-blank',
        question: blankQuestion,
        correctAnswer: normalizedWord || 'example',
        explanation: anchor.definition || 'No explanation available.',
      };
    }

    function buildPronunciationPreview(exercise, index) {
      const words = Array.isArray(exercise.words) ? exercise.words.filter(Boolean) : [];
      const anchor = words[0] || { word: 'example', pronunciation: '', language: 'en' };
      return {
        id: `preview-${index}`,
        type: 'pronunciation',
        word: anchor.word || 'example',
        audioUrl: anchor.pronunciation || '',
        language: String(anchor.language || 'en').toLowerCase(),
      };
    }

    function buildMatchingPreview(exercise, index) {
      const words = Array.isArray(exercise.words) ? exercise.words.filter(Boolean) : [];
      const labels = words.map(w => w.word).filter(Boolean);
      const defs = words.map(w => w.definition).filter(Boolean);

      return {
        id: `preview-${index}`,
        type: 'matching',
        words: labels.length ? labels : ['word one', 'word two'],
        definitions: defs.length ? defs : ['definition one', 'definition two'],
      };
    }

    function buildEssayPreview(exercise, index) {
      const words = Array.isArray(exercise.words) ? exercise.words.filter(Boolean) : [];
      const sampleWords = words.slice(0, 3).map(w => w.word).filter(Boolean);
      const prompt = sampleWords.length
        ? `Write a short paragraph using these words naturally: ${sampleWords.join(', ')}.`
        : 'Write a short paragraph explaining what you learned in this lesson.';

      return {
        id: `preview-${index}`,
        type: 'essay',
        question: prompt,
      };
    }

    function buildPreviewExercise(exercise, index) {
      const type = String(exercise?.type || '').trim().toLowerCase();
      if (type === 'multiple-choice') return buildMultipleChoicePreview(exercise, index);
      if (type === 'fill-blank') return buildFillBlankPreview(exercise, index);
      if (type === 'pronunciation') return buildPronunciationPreview(exercise, index);
      if (type === 'matching') return buildMatchingPreview(exercise, index);
      return buildEssayPreview(exercise, index);
    }

    async function saveLesson() {
      const title = document.getElementById('lessonTitle').value;
      if (!title) {
        alert('Enter lesson title');
        return;
      }

      if (exercises.length === 0) {
        alert('Add at least one exercise');
        return;
      }

      alert('Lesson saved! (Integration with backend coming)');
    }

    function previewLesson() {
      if (exercises.length === 0) {
        alert('Create exercises first');
        return;
      }

      const lessonTitle = String(document.getElementById('lessonTitle').value || '').trim() || 'Untitled Lesson Preview';
      const previewExercises = exercises.map((exercise, index) => buildPreviewExercise(exercise, index));

      const payload = {
        title: lessonTitle,
        chapterTitle: 'Preview Mode',
        exercises: previewExercises,
        createdAt: new Date().toISOString(),
      };

      try {
        sessionStorage.setItem('lessonPreviewData', JSON.stringify(payload));
      } catch (err) {
        alert('Preview data is too large to store in your browser. Remove some exercises and try again.');
        return;
      }

      const previewWindow = window.open('/lesson-player.html?preview=1', '_blank');
      if (!previewWindow) {
        alert('Popup blocked. Please allow popups for this site to open lesson preview.');
      }
    }

    function goBack() {
      window.location.href = '/creator-cms.html';
    }

    document.addEventListener('DOMContentLoaded', initialize);
  </script>
</body>
</html>
